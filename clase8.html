    <style>
  div {
    border: 2px solid #333;
    padding: 10px;
    margin: 5px;
  }

  .block {
    display: block;
    background-color: lightcoral;
  }

  .inline {
    display: inline;
    background-color: lightblue;
  }

  .inline-block {
    display: inline-block;
    background-color: lightgreen;
    width: 100px;
    height: 100px;
  }
</style>

<h2>Ejemplo: diferencias de display</h2>

<h3>Block:</h3>
<div class="block">Caja 1</div>
<div class="block">Caja 2</div>

<h3>Inline:</h3>
<span class="inline">Caja 1</span>
<span class="inline">Caja 2</span>

<h3>Inline-Block:</h3>
<div class="inline-block">Caja 1</div>
<div class="inline-block">Caja 2</div>

que se muestra con
sus propios espacios.
